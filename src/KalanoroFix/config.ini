; Kalanoro Fix - graphics options and bug fixes

; ---- Display
; The game ships with VSync off and no frame cap, which runs the GPU at 100%.
VSync = true
; Frame cap in FPS, 0 = none (with VSync on the monitor's refresh rate is the cap)
FrameRateLimit = 0
; HDR output (only on HDR-capable displays with Windows HDR enabled); peak brightness in nits
HDR = false
HDRNits = 1000

; ---- Image quality / performance
; Anti-aliasing: Game (keep the game's FXAA), FXAA, TAA, TSR (Unreal's temporal upscaler, best with ResolutionScale < 100), Off
AntiAliasing = Game
; Render resolution in percent (50-100). Below 100 the image is upscaled; use with AntiAliasing = TSR.
ResolutionScale = 100
MotionBlur = true
; Low-end GPUs: Low quality, TSR upscaling from 67%, no motion blur (overrides the quality menu and the three settings above)
PerformanceMode = false

; ---- Fixes
; The left/right arrows of settings options (screen mode, quality, language) never appear with a mouse; keep them visible.
FixSettingsMenuMouse = true
; The Quality option is blank and stuck when the engine reports a "custom" quality; snap it to Low/Medium/High/Epic.
FixQualitySetting = true
; Show the mouse cursor in menus (inventory...) when playing with keyboard and mouse.
FixMenuCursor = true
; Press to recover when the controls stop responding (closes a stuck menu, restores game input).
UnstuckKey = F11
