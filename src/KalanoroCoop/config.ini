; Kalanoro Co-op settings

; The Join key joins the IP address you copied (the host's IP is put on their clipboard when they host); with no
; address on the clipboard it joins this one. The last address you joined is saved here automatically.
; (LAN IP, VPN IP such as ZeroTier/Tailscale/Radmin, or public IP with UDP port 7777 forwarded; append :port if
; the host forwards a different port.)
JoinAddress = 127.0.0.1

; Name shown above your character for the other players (empty = your Windows user name)
PlayerName =

; Keys (UE4SS key names: F1..F12, NUM_ZERO, etc.)
HostKey = F5
JoinKey = F6
LeaveKey = F7
; Teleport next to your partner (if you fall behind or get stuck)
TeleportKey = F8
; Ping: marks the enemy in front of you (or your spot) for everyone
PingKey = MIDDLE_MOUSE_BUTTON

; Level changes are led by the host. Set to true to let a client's level exit / cutscene end move the whole group.
ClientsCanChangeLevel = false

; Clients play the session with the host's story progress (quests, unlocked areas, village...). Your own save
; file is not touched and your own progress is back when you leave. false = keep your own progress in sessions.
FollowHostProgress = true

; Extra logging in ue4ss/UE4SS.log
Debug = false
